<!DOCTYPE html>
<html lang="en" style="height:auto; min-height:100%;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArNita Infotech - Admin Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Work Sans', 'sans-serif'],
          },
          borderRadius: {
            small: '8px',
            large: '16px',
          },
          boxShadow: {
            custom: '0px 4px 24px 0px rgba(15, 23, 42, 0.08)',
            'custom-hover': '0px 8px 40px 0px rgba(15, 23, 42, 0.14)',
          },
        }
      }
    }
  </script>
</head>
<body class="font-body bg-gray-50 text-neutral-900 min-h-screen">

  <nav class="bg-white border-b border-neutral-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/admin-dashboard" class="flex items-center gap-3">
        <div class="w-9 h-9 bg-indigo-600 rounded-small flex items-center justify-center">
          <span class="text-white font-heading font-bold text-sm">AI</span>
        </div>
        <span class="font-heading font-bold text-xl text-neutral-900">ArNita Infotech</span>
      </a>

      <div class="hidden md:flex items-center gap-8">
        <a href="/admin-dashboard" class="text-neutral-600 hover:text-indigo-600 text-sm font-medium">Dashboard</a>
        <a href="./admin_users.html" class="text-neutral-600 hover:text-indigo-600 text-sm font-medium">Users</a>
        <a href="./admin_profile.html" class="text-indigo-600 text-sm font-medium">Profile</a>
      </div>

      <a href="/logout" class="text-sm font-medium text-neutral-700 hover:text-indigo-600">Logout</a>
    </div>
  </nav>

  <section class="max-w-7xl mx-auto px-6 py-10">
    <div class="mb-8">
      <p class="text-sm text-indigo-600 font-semibold mb-2">Admin Account</p>
      <h1 class="font-heading font-extrabold text-3xl md:text-4xl text-neutral-900">Admin Profile</h1>
      <p class="text-neutral-600 mt-2">Manage your administrator profile and account information.</p>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
      <div class="bg-white rounded-large shadow-custom p-6 xl:col-span-1">
        <div class="flex flex-col items-center text-center">
          <div class="w-28 h-28 rounded-full bg-rose-100 flex items-center justify-center text-3xl font-heading font-bold text-rose-600 shadow-custom">
            A
          </div>

          <h2 id="adminNameCard" class="font-heading font-bold text-2xl text-neutral-900 mt-4">Admin Name</h2>
          <p class="text-sm text-neutral-500 mt-1">Administrator</p>

          <div class="grid grid-cols-1 gap-3 w-full mt-6">
            <div class="bg-neutral-50 rounded-large p-4 text-left">
              <p class="text-xs text-neutral-500">Role</p>
              <p class="font-semibold text-neutral-900 mt-1">Admin</p>
            </div>
            <div class="bg-neutral-50 rounded-large p-4 text-left">
              <p class="text-xs text-neutral-500">Account Status</p>
              <p id="adminStatusCard" class="font-semibold text-neutral-900 mt-1">Active</p>
            </div>
          </div>

          <div class="w-full mt-6 border-t border-neutral-200 pt-5 text-left space-y-3">
            <div>
              <p class="text-xs text-neutral-500">Department</p>
              <p id="adminDepartmentCard" class="text-sm font-semibold text-neutral-900 mt-1">Not added</p>
            </div>
            <div>
              <p class="text-xs text-neutral-500">Phone</p>
              <p id="adminPhoneCard" class="text-sm font-semibold text-neutral-900 mt-1">Not added</p>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-large shadow-custom p-6 xl:col-span-2">
        <h2 class="font-heading font-bold text-xl text-neutral-900 mb-5">Profile Details</h2>

        <form id="adminProfileForm" class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
              <label class="block text-sm font-semibold text-neutral-700 mb-2">Full Name</label>
              <input
                id="adminName"
                type="text"
                class="w-full border border-neutral-300 rounded-small px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400"
                placeholder="Enter full name"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-neutral-700 mb-2">Email</label>
              <input
                id="adminEmail"
                type="email"
                class="w-full border border-neutral-300 rounded-small px-4 py-3 text-sm bg-neutral-50 text-neutral-500"
                placeholder="Enter email"
                readonly
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-neutral-700 mb-2">Phone</label>
              <input
                id="adminPhone"
                type="text"
                class="w-full border border-neutral-300 rounded-small px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400"
                placeholder="Enter phone number"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-neutral-700 mb-2">Department</label>
              <input
                id="adminDepartment"
                type="text"
                class="w-full border border-neutral-300 rounded-small px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400"
                placeholder="e.g. Administration"
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-neutral-700 mb-2">Bio</label>
            <textarea
              id="adminBio"
              rows="5"
              class="w-full border border-neutral-300 rounded-small px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400"
              placeholder="Write a short admin bio..."
            ></textarea>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 pt-2">
            <button
              type="submit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-6 py-3 rounded-small transition-colors"
            >
              Save Profile
            </button>

            <button
              type="button"
              onclick="loadAdminProfile()"
              class="border border-neutral-300 hover:bg-neutral-50 text-neutral-700 font-semibold text-sm px-6 py-3 rounded-small transition-colors"
            >
              Reset
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <script>
    async function loadAdminProfile() {
      try {
        const res = await fetch("/api/profile/me", {
          credentials: "include"
        });

        if (!res.ok) return;
        const data = await res.json();

        document.getElementById("adminNameCard").textContent = data.name || "Admin Name";
        document.getElementById("adminStatusCard").textContent = data.status || "Active";
        document.getElementById("adminDepartmentCard").textContent = data.department || "Not added";
        document.getElementById("adminPhoneCard").textContent = data.phone || "Not added";

        document.getElementById("adminName").value = data.name || "";
        document.getElementById("adminEmail").value = data.email || "";
        document.getElementById("adminPhone").value = data.phone || "";
        document.getElementById("adminDepartment").value = data.department || "";
        document.getElementById("adminBio").value = data.bio || "";
      } catch (err) {
        console.error("Error loading admin profile:", err);
      }
    }

    document.getElementById("adminProfileForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      try {
        await fetch("/api/profile/me", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({
            name: document.getElementById("adminName").value,
            phone: document.getElementById("adminPhone").value,
            department: document.getElementById("adminDepartment").value,
            bio: document.getElementById("adminBio").value
          })
        });

        alert("Profile updated successfully");
        loadAdminProfile();
      } catch (err) {
        console.error("Error updating admin profile:", err);
      }
    });

    document.addEventListener("DOMContentLoaded", loadAdminProfile);
  </script>
</body>
</html>
