<!DOCTYPE html>
<html lang="en" style="height: auto; min-height: 100%;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArNita Infotech - Course Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Work Sans', 'sans-serif'],
          },
          borderRadius: {
            small: '8px',
            large: '16px',
          },
          boxShadow: {
            custom: '0px 4px 24px 0px rgba(15, 23, 42, 0.08)',
            'custom-hover': '0px 8px 40px 0px rgba(15, 23, 42, 0.14)',
          },
        }
      }
    }
  </script>
</head>
<body class="font-body bg-gray-50 text-neutral-900 min-h-screen">

  <nav class="bg-white border-b border-neutral-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/home" class="flex items-center gap-3">
        <div class="w-9 h-9 bg-indigo-600 rounded-small flex items-center justify-center">
          <span class="text-white font-heading font-bold text-sm">AI</span>
        </div>
        <span class="font-heading font-bold text-xl text-neutral-900">ArNita Infotech</span>
      </a>
      <div class="flex items-center gap-6">
        <a href="/home" class="text-sm text-neutral-600 hover:text-indigo-600">Home</a>
        <a href="/courses" class="text-sm text-neutral-600 hover:text-indigo-600">Courses</a>
        <a href="http://localhost:3000" class="text-sm text-neutral-600 hover:text-indigo-600">Log In</a>
      </div>
    </div>
  </nav>

  <section class="max-w-7xl mx-auto px-6 py-10">
    <div id="loadingState" class="bg-white rounded-large shadow-custom p-10 text-center">
      <p class="text-neutral-500">Loading course details...</p>
    </div>

    <div id="courseContent" class="hidden">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
        <div class="lg:col-span-2 bg-white rounded-large shadow-custom overflow-hidden">
          <img id="courseThumbnail" src="" alt="Course Thumbnail" class="w-full h-72 object-cover">
          <div class="p-8">
            <p id="courseCategory" class="text-sm font-semibold text-indigo-600 mb-3"></p>
            <h1 id="courseTitle" class="font-heading font-extrabold text-4xl text-neutral-900 mb-4"></h1>
            <p id="courseDescription" class="text-neutral-600 text-lg leading-relaxed mb-4"></p>
            <p id="courseMeta" class="text-sm text-neutral-500"></p>
          </div>
        </div>

        <div class="bg-white rounded-large shadow-custom p-6 h-fit">
          <h2 class="font-heading font-bold text-xl text-neutral-900 mb-4">Course Overview</h2>
          <div class="space-y-3 mb-6">
            <div class="flex justify-between text-sm">
              <span class="text-neutral-500">Level</span>
              <span id="overviewLevel" class="font-medium text-neutral-900"></span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-neutral-500">Duration</span>
              <span id="overviewDuration" class="font-medium text-neutral-900"></span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-neutral-500">Instructor</span>
              <span id="overviewTeacher" class="font-medium text-neutral-900"></span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-neutral-500">Price</span>
              <span id="overviewPrice" class="font-medium text-indigo-600"></span>
            </div>
          </div>
          <a href="http://localhost:3000" class="block w-full text-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-3 rounded-small transition-colors shadow-custom">
            Log In to Enroll
          </a>
        </div>
      </div>

      <div>
        <h2 class="font-heading font-bold text-2xl text-neutral-900 mb-5">Course Modules</h2>
        <div id="moduleList" class="space-y-5"></div>
      </div>
    </div>

    <div id="errorState" class="hidden bg-white rounded-large shadow-custom p-10 text-center">
      <h3 class="font-heading font-semibold text-xl text-neutral-900 mb-2">Course not found</h3>
      <p class="text-neutral-500 mb-4">The course you are looking for does not exist or is not published.</p>
      <a href="/courses" class="inline-flex items-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-5 py-3 rounded-small transition-colors">
        Back to Catalog
      </a>
    </div>
  </section>

  <script>
    async function loadCourseDetail() {
      const loadingState = document.getElementById("loadingState");
      const errorState = document.getElementById("errorState");
      const courseContent = document.getElementById("courseContent");

      try {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");

        if (!slug) {
          loadingState.classList.add("hidden");
          errorState.classList.remove("hidden");
          return;
        }

        const res = await fetch(`/api/public/courses/${slug}`);
        if (!res.ok) {
          throw new Error("Course not found");
        }

        const data = await res.json();

        document.getElementById("courseThumbnail").src =
          data.course.thumbnail || "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1200&h=600&fit=crop";
        document.getElementById("courseThumbnail").alt = data.course.title || "Course Thumbnail";

        document.getElementById("courseCategory").textContent = data.course.category || "General";
        document.getElementById("courseTitle").textContent = data.course.title || "";
        document.getElementById("courseDescription").textContent = data.course.description || "";
        document.getElementById("courseMeta").textContent =
          `By ${data.course.teacherName || "ArNita Faculty"} · ${data.course.level || "Beginner"} · ${data.course.duration || "Self-paced"}`;

        document.getElementById("overviewLevel").textContent = data.course.level || "Beginner";
        document.getElementById("overviewDuration").textContent = data.course.duration || "Self-paced";
        document.getElementById("overviewTeacher").textContent = data.course.teacherName || "ArNita Faculty";
        document.getElementById("overviewPrice").textContent =
          data.course.price === 0 || data.course.price == null ? "Free" : `₹${data.course.price}`;

        const moduleList = document.getElementById("moduleList");
        moduleList.innerHTML = "";

        if (!data.modules || !data.modules.length) {
          moduleList.innerHTML = `
            <div class="bg-white rounded-large shadow-custom p-8 text-center">
              <p class="text-neutral-500">No modules available for this course yet.</p>
            </div>
          `;
        } else {
            data.modules.forEach((module, index) => {
            const card = document.createElement("div");
            card.className = "bg-white rounded-large shadow-custom p-6";

            const lessonsHtml = (module.lessons || []).map((lesson) => `
              <a href="/lesson?lessonId=${lesson._id}" class="block py-3 border-b border-neutral-100 last:border-b-0 hover:bg-neutral-50 transition-colors rounded-small px-2 -mx-2">
                <span class="text-neutral-800 font-medium">${lesson.title}</span>
              </a>
            `).join("");

            card.innerHTML = `
              <div class="flex items-start justify-between gap-4 mb-4">
                <div>
                  <p class="text-xs font-semibold text-indigo-600 mb-2">Module ${index + 1}</p>
                  <h3 class="font-heading font-semibold text-xl text-neutral-900">${module.title}</h3>
                  <p class="text-sm text-neutral-500 mt-2">${module.description || ""}</p>
                </div>
              </div>
              <div class="mt-4">
                ${lessonsHtml || `<p class="text-sm text-neutral-500">No lessons added yet.</p>`}
              </div>
            `;

            moduleList.appendChild(card);
          });
        }

        loadingState.classList.add("hidden");
        courseContent.classList.remove("hidden");
      } catch (err) {
        console.error("Error loading course details:", err);

        document.getElementById("loadingState").classList.remove("hidden");
        document.getElementById("loadingState").innerHTML = `
          <div class="text-center">
            <p class="text-neutral-500 mb-4">Unable to load course details right now.</p>
            <a href="/courses" class="inline-flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-5 py-3 rounded-small transition-colors">
              Back to Courses
            </a>
          </div>
        `;

        document.getElementById("courseContent").classList.add("hidden");
        document.getElementById("errorState").classList.add("hidden");
      }
    }

    document.addEventListener("DOMContentLoaded", loadCourseDetail);
  </script>
</body>
</html>
